# Project manifest -- the ordering spine for this book's video series.
# Embedded posture: this `ageation/` folder lives inside the Probability book
# repo; upstream_dir points back at the book's chapters/.
# Editable working copies are vendored into sources/ (tools/vendor_sources.py)
# and are what the pipeline actually builds from.

project:
  title: Probability
  shape: course             # many section-videos; recap_prior=true, narration=1.0x
  upstream_dir: ../chapters
  render:
    quality: ql             # ql = 480p draft; qh = 1080p final
  voice:
    provider: openai        # final voice (needs OPENAI_API_KEY in .env)
    name: nova              # enthusiastic, clear -- good for technical content
    rate: 1.0
  pedagogy:
    target_minutes_per_video: 10   # this chapter's two videos target ~10 min each
    open_with_objective: true
    close_with_key_idea: true
    recap_prior: true

# Notation convention as data (same book, same rules as the worked example).
# Enforced by tools/check_notation.py; manim has no access to the book's macros,
# so scenes use the expanded forms via scenes/_style.py helpers.
notation:
  rules:
    - avoid: '\mathbb{P}'
      use: '\Pr'
      reason: probability
    - avoid: '\mathbb{E}'
      use: '\mathrm{E}'
      reason: expectation
    - avoid: '\mathbb{V}'
      use: '\mathrm{Var}'
      reason: variance
    - avoid: '\operatorname{E}'
      use: '\mathrm{E}'
      reason: expectation
    - avoid: '\mathbb{1}'
      use: '\mathbf{1}'
      reason: indicator

