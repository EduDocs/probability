# Geometric-lint allowlist for scenes/functions.py.
#
# Both arrow-diagram scenes (RelationsToFunctions, InjSurjBij) trip the overlap
# lint for the same unavoidable reason: a mapping arrow starts and ends at dots
# that live *inside* the X and Y ovals, so each arrow's bounding box overlaps an
# oval's. And a couple of arrows deliberately cross (two arrows from one node in
# the "messy" relation; two inputs sharing a target in the surjection). These
# are correct diagrams, not layout bugs -- the bounding-box test just overstates
# overlap for long/diagonal arrows. snapshot "*" matches every frame.

ignore:
  # --- RelationsToFunctions: arrows anchored to dots inside the X/Y ovals ---
  - snapshot: "*"
    a: "Ellipse[1]"
    b: "Arrow[10]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "Ellipse[1]"
    b: "Arrow[11]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "Ellipse[1]"
    b: "Arrow[12]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "Ellipse[1]"
    b: "Arrow[13]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "Ellipse[1]"
    b: "Arrow[14]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "Ellipse[2]"
    b: "Arrow[10]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "Ellipse[2]"
    b: "Arrow[11]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "Ellipse[2]"
    b: "Arrow[12]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "Ellipse[2]"
    b: "Arrow[13]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "Ellipse[2]"
    b: "Arrow[14]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "Arrow[11]"
    b: "Arrow[12]"
    reason: "two arrows leave the same node in the messy relation (intentional)"

  # --- InjSurjBij: same arrows-into-ovals story, diagrams wrapped in a VGroup ---
  - snapshot: "*"
    a: "VGroup[1].VGroup[0].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[0]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[0].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[1]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[0].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[2]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[0].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[3]"
    reason: "arrow meets a dot inside the X oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[1].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[0]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[1].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[1]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[1].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[2]"
    reason: "arrow meets a dot inside the Y oval"
  - snapshot: "*"
    a: "VGroup[1].VGroup[1].Ellipse[0]"
    b: "VGroup[1].VGroup[4].Arrow[3]"
    reason: "arrow meets a dot inside the Y oval"
