# Geometric-lint allowlist for scenes/sets.py.
#
# Only the Partition scene needs entries. Its overlaps are all intentional and
# unavoidable for the visual: a partition is, by definition, pieces that tile a
# whole with no gaps, so adjacent pie-wedges touch at the disk centre (their
# bounding boxes overlap even though the filled regions only share an edge), the
# S1/S2/S3 labels sit *inside* their wedges, and the event A is drawn crossing
# every wedge on purpose -- that crossing is the whole point of the
# total-probability teaser. snapshot "*" matches every frame.

ignore:
  # Adjacent wedges touch at the disk centre (before the disk is regrouped).
  - snapshot: "*"
    a: "AnnularSector[3]"
    b: "AnnularSector[4]"
    reason: "adjacent partition wedges meet at the centre"
  - snapshot: "*"
    a: "AnnularSector[4]"
    b: "AnnularSector[5]"
    reason: "adjacent partition wedges meet at the centre"
  # Wedge labels sit inside their own wedge (label-in-region is intentional).
  - snapshot: "*"
    a: "AnnularSector[3]"
    b: "MathTexPart[7].VMobjectFromSVGPath[0]"
    reason: "S1 label inside its wedge"
  - snapshot: "*"
    a: "AnnularSector[3]"
    b: "MathTexPart[7].VMobjectFromSVGPath[1]"
    reason: "S1 label inside its wedge"
  - snapshot: "*"
    a: "AnnularSector[4]"
    b: "MathTexPart[8].VMobjectFromSVGPath[0]"
    reason: "S2 label inside its wedge"
  - snapshot: "*"
    a: "AnnularSector[4]"
    b: "MathTexPart[8].VMobjectFromSVGPath[1]"
    reason: "S2 label inside its wedge"
  - snapshot: "*"
    a: "AnnularSector[5]"
    b: "MathTexPart[9].VMobjectFromSVGPath[0]"
    reason: "S3 label inside its wedge"
  - snapshot: "*"
    a: "AnnularSector[5]"
    b: "MathTexPart[9].VMobjectFromSVGPath[1]"
    reason: "S3 label inside its wedge"
  # After VGroup(wedges, labels) the disk is regrouped to Group[8].
  - snapshot: "*"
    a: "MathTexPart[4].VMobjectFromSVGPath[0]"
    b: "Group[8].AnnularSector[0]"
    reason: "S1 label inside its wedge"
  - snapshot: "*"
    a: "MathTexPart[4].VMobjectFromSVGPath[1]"
    b: "Group[8].AnnularSector[0]"
    reason: "S1 label inside its wedge"
  - snapshot: "*"
    a: "MathTexPart[5].VMobjectFromSVGPath[0]"
    b: "Group[8].AnnularSector[1]"
    reason: "S2 label inside its wedge"
  - snapshot: "*"
    a: "MathTexPart[5].VMobjectFromSVGPath[1]"
    b: "Group[8].AnnularSector[1]"
    reason: "S2 label inside its wedge"
  - snapshot: "*"
    a: "MathTexPart[6].VMobjectFromSVGPath[0]"
    b: "Group[8].AnnularSector[2]"
    reason: "S3 label inside its wedge"
  - snapshot: "*"
    a: "MathTexPart[6].VMobjectFromSVGPath[1]"
    b: "Group[8].AnnularSector[2]"
    reason: "S3 label inside its wedge"
  - snapshot: "*"
    a: "Group[8].AnnularSector[0]"
    b: "Group[8].AnnularSector[1]"
    reason: "adjacent partition wedges meet at the centre"
  - snapshot: "*"
    a: "Group[8].AnnularSector[1]"
    b: "Group[8].AnnularSector[2]"
    reason: "adjacent partition wedges meet at the centre"
  # The event A is drawn crossing every wedge -- the total-probability teaser.
  - snapshot: "*"
    a: "Group[8].AnnularSector[0]"
    b: "Ellipse[9]"
    reason: "event A deliberately spans the partition"
  - snapshot: "*"
    a: "Group[8].AnnularSector[1]"
    b: "Ellipse[9]"
    reason: "event A deliberately spans the partition"
  - snapshot: "*"
    a: "Group[8].AnnularSector[2]"
    b: "Ellipse[9]"
    reason: "event A deliberately spans the partition"

  # --- AlgebraicRules: the two precedence Venn triples ---------------------
  # Three mutually overlapping circles per triple (a Venn diagram is supposed
  # to overlap), plus each circle overlapping the shaded boolean region.
  # Left triple = VGroup[2] with Union[6]; right triple = VGroup[4] with
  # Intersection[7].
  - snapshot: "*"
    a: "VGroup[2].Circle[0]"
    b: "VGroup[2].Circle[1]"
    reason: "overlapping circles of the left Venn"
  - snapshot: "*"
    a: "VGroup[2].Circle[0]"
    b: "VGroup[2].Circle[2]"
    reason: "overlapping circles of the left Venn"
  - snapshot: "*"
    a: "VGroup[2].Circle[1]"
    b: "VGroup[2].Circle[2]"
    reason: "overlapping circles of the left Venn"
  - snapshot: "*"
    a: "VGroup[2].Circle[0]"
    b: "Union[6]"
    reason: "shaded region sits inside the left Venn circles"
  - snapshot: "*"
    a: "VGroup[2].Circle[1]"
    b: "Union[6]"
    reason: "shaded region sits inside the left Venn circles"
  - snapshot: "*"
    a: "VGroup[2].Circle[2]"
    b: "Union[6]"
    reason: "shaded region sits inside the left Venn circles"
  - snapshot: "*"
    a: "VGroup[4].Circle[0]"
    b: "VGroup[4].Circle[1]"
    reason: "overlapping circles of the right Venn"
  - snapshot: "*"
    a: "VGroup[4].Circle[0]"
    b: "VGroup[4].Circle[2]"
    reason: "overlapping circles of the right Venn"
  - snapshot: "*"
    a: "VGroup[4].Circle[1]"
    b: "VGroup[4].Circle[2]"
    reason: "overlapping circles of the right Venn"
  - snapshot: "*"
    a: "VGroup[4].Circle[0]"
    b: "Intersection[7]"
    reason: "shaded region sits inside the right Venn circles"
  - snapshot: "*"
    a: "VGroup[4].Circle[1]"
    b: "Intersection[7]"
    reason: "shaded region sits inside the right Venn circles"
