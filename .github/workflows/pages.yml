name: Deploy course site

# Builds the course website and deploys it to GitHub Pages.
#
# The book PDF is NOT built here and is NOT stored in git. You build it locally
# (`just publish-pdf`), which uploads it as an asset on the rolling `pdf`
# release; this workflow just pulls that asset into the deployed site. So the
# slow, fragile LaTeX build stays on your machine, the PDF never touches the
# repo, and deploys are fast.

# Manual only: this site deploys when you ask it to, never automatically on a
# push. Trigger it with:  just deploy   (or `gh workflow run pages.yml`).
on:
  workflow_dispatch:

# Least-privilege token: read the repo (incl. release assets), publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer runs cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # PyYAML parses the sidecars' `videos:` blocks. The graph edges parse fine
      # without it; only the video links need it.
      - name: Install generator dependencies
        run: python3 -m pip install --break-system-packages pyyaml

      # Generate the concept-map data (site/data/graph.json) from the chapter sidecars.
      - name: Generate the concept-map data
        run: python3 scripts/site_data.py

      # Assemble the static site: the committed site/ folder plus the generated data.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/

      # Pull the locally built book PDF from the `pdf` release (built and
      # uploaded via `just publish-pdf`; not stored in git).
      - name: Fetch the book PDF from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pdf --pattern probability.pdf --dir _site --clobber

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
